on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        run: apt-get update -qq && apt-get install -y -qq python3 python3-pip
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install --break-system-packages -r requirements.txt || true; fi
          if [ -f pyproject.toml ]; then pip install --break-system-packages -e ".[dev]" 2>/dev/null || true; fi
      - name: Lint
        run: |
          pip install --break-system-packages ruff 2>/dev/null
          ruff check . || true
      - name: Test (failures block)
        run: |
          pip install --break-system-packages pytest
          LLM_PROVIDER=ollama LLM_BASE_URL=http://127.0.0.1:9 python3 -m pytest tests/ -v
