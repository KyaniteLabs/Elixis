name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          python -m pytest tests/ -v

      - name: Upload coverage (optional)
        if: github.event_name == 'push'
        run: |
          echo "Tests completed successfully"

  build:
    needs: test
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: [self-hosted, nuc]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && vars.ENABLE_VPS_DEPLOY == 'true'
    environment: production
    continue-on-error: true # Deploy failures are non-blocking until Tailscale OAuth secrets are configured.
    permissions:
      contents: read
      packages: read
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      GHCR_TOKEN: ${{ github.token }}
      VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Deploy to VPS
        run: |
          IMAGE_REF="${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA::7}"
          IMAGE_REF="$(echo "${IMAGE_REF}" | tr '[:upper:]' '[:lower:]')"

          : "${VPS_HOST:?secrets.VPS_HOST is not set}"
          : "${VPS_SSH_KNOWN_HOSTS:?secrets.VPS_SSH_KNOWN_HOSTS is not set}"

          deploy_env="$(mktemp)"
          known_hosts="$(mktemp)"
          remote_script="$(mktemp)"
          trap 'rm -f "${deploy_env}" "${known_hosts}" "${remote_script}"' EXIT
          {
            printf 'export ELIXIS_IMAGE=%q\n' "${IMAGE_REF}"
            printf 'export REGISTRY=%q\n' "${REGISTRY}"
            printf 'export GITHUB_ACTOR=%q\n' "${GITHUB_ACTOR}"
          } > "${deploy_env}"
          printf '%s\n' "${VPS_SSH_KNOWN_HOSTS}" > "${known_hosts}"

          # Host keys are pinned to secrets.VPS_SSH_KNOWN_HOSTS and verified
          # strictly; an unknown host key fails the deploy instead of being
          # silently accepted.
          SSH_OPTS=(-o StrictHostKeyChecking=yes -o "UserKnownHostsFile=${known_hosts}")

          # Copy compose file to VPS using local key (self-hosted runner has ssh config)
          scp "${SSH_OPTS[@]}" docker-compose.yml "root@${VPS_HOST}:/docker/elixis/"
          scp "${SSH_OPTS[@]}" "${deploy_env}" "root@${VPS_HOST}:/tmp/elixis-deploy-env"

          cat > "${remote_script}" << 'EOF'
            set -euo pipefail
            REGISTRY=""
            docker_config=""
            trap 'if [ -n "${REGISTRY}" ]; then docker logout "${REGISTRY}" >/dev/null 2>&1 || true; fi; rm -rf "${docker_config}" /tmp/elixis-deploy-env' EXIT
            cd /docker/elixis
            source /tmp/elixis-deploy-env
            touch .env
            if grep -q '^ELIXIS_IMAGE=' .env; then
              tmp_env="$(mktemp)"
              sed "s|^ELIXIS_IMAGE=.*|ELIXIS_IMAGE=${ELIXIS_IMAGE}|" .env > "${tmp_env}"
              cat "${tmp_env}" > .env
              rm -f "${tmp_env}"
            else
              printf '\nELIXIS_IMAGE=%s\n' "${ELIXIS_IMAGE}" >> .env
            fi
            # Registry credentials stay in an ephemeral DOCKER_CONFIG that the
            # EXIT trap removes, so nothing is persisted for the shared VPS.
            docker_config="$(mktemp -d)"
            export DOCKER_CONFIG="${docker_config}"
            printf '%s' "${GHCR_TOKEN}" | docker login "${REGISTRY}" -u "${GITHUB_ACTOR}" --password-stdin
            unset GHCR_TOKEN
            docker compose pull elixis
            docker compose up -d --no-build --remove-orphans
            actual_image="$(docker inspect elixis --format '{{.Config.Image}}')"
            if [ "${actual_image}" != "${ELIXIS_IMAGE}" ]; then
              echo "::error::elixis is running ${actual_image}, expected ${ELIXIS_IMAGE}"
              exit 1
            fi
            # Deliberately no global prune: this shared VPS hosts sibling
            # containers and images that a global prune must never remove.
          EOF

          # GHCR_TOKEN rides the first line of stdin, so it is never written
          # to a file on either host and never appears in a process listing.
          printf '%s\n' "${GHCR_TOKEN}" | cat - "${remote_script}" \
            | ssh "${SSH_OPTS[@]}" "root@${VPS_HOST}" 'read -r GHCR_TOKEN && export GHCR_TOKEN && bash -se'
