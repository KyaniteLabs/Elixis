name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          python -m pytest tests/ -v

      - name: Upload coverage (optional)
        if: github.event_name == 'push'
        run: |
          echo "Tests completed successfully"

  # Moved from Forgejo CI (ci-profile, .ci/profile.json) when GitHub became the
  # only CI (GIT-CI-STRATEGY-20261123): correctness lint, the wheel built once and
  # smoke-tested from a clean venv, and a boot of the source server.
  package:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Install production Python 3.14, runtime deps and pinned test tools
        run: |
          uv venv --python 3.14 .venv
          uv pip install --python .venv -r requirements.txt pytest==9.1.1 ruff==0.15.21
      - name: Lint for correctness errors
        run: .venv/bin/ruff check --isolated --select E4,E7,E9,F app.py elixis scripts tests
      - name: Build the wheel once and record its digest
        run: |
          uv build --wheel --out-dir .ci-results/dist .
          (cd .ci-results/dist && sha256sum *.whl | tee SHA256SUMS)
      - name: Run all tests on Python 3.14
        run: .venv/bin/python -m pytest tests -q --tb=short -p no:cacheprovider
      - name: Smoke-test the built wheel, then boot the source server
        shell: bash
        run: |
          set -euo pipefail
          (cd .ci-results/dist && sha256sum -c SHA256SUMS)
          accept=$(mktemp -d)
          uv venv --python 3.14 "$accept"
          uv pip install --python "$accept" .ci-results/dist/*.whl
          (cd "$accept" && ./bin/elixis --version && ./bin/elixis --help > /dev/null \
            && ./bin/python -I -c 'from elixis import knowledge as k; assert k.archetypes() and k.characters(), "wheel is missing knowledge data"' \
            && env -u LLM_PROVIDER -u LLM_FALLBACK_URL LLM_BASE_URL=http://127.0.0.1:9 ./bin/elixis patterns --text 'A quiet glassblower restores old lighthouse lenses.' > /dev/null)
          log=.ci-results/server.log
          .venv/bin/python app.py --port 3110 > "$log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3110/ && break; sleep 1; done
          kill -0 "$pid" || { echo 'server exited early'; cat "$log"; exit 1; }
          for path in / /llms.txt /api/health; do
            code=$(curl -s -o .ci-results/http-body.json -w '%{http_code}' "http://127.0.0.1:3110$path" || true)
            echo "$path $code"
            test "$code" = 200 || { cat "$log"; exit 1; }
          done
          python3 -c 'import json; b=json.load(open(".ci-results/http-body.json")); assert b["status"] in ("ok", "degraded") and b["disk"] == "ok", b; print("health:", b)'

  build:
    needs: test
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
